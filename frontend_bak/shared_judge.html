<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>评委老师终端打分平台</title>
    <link rel="stylesheet" href="/swiper.css"/>
    <script src="/swiper.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-inner: rgba(0, 0, 0, 0.15);
            --apple-blue: #0A84FF; --apple-orange: #FF9F0A; --apple-red: #FF453A; --apple-green: #32D74B;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at 50% -20%, #1a1a2e 0%, #121212 80%);
            color: white;
            font-family: -apple-system, "SF Pro Display", sans-serif;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
            overflow: hidden; user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 🚨核心美学：液态玻璃与嵌套圆角规则 (20 = 16 + 4) ================= */
        .glass-outer {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 4px;
            backdrop-filter: blur(40px) saturate(160%); /* 增强模糊和饱和度 */
            -webkit-backdrop-filter: blur(40px) saturate(160%);

            /* 🚨 实现边缘光线 (Edge Light) */
            box-shadow:
                    0 15px 35px rgba(0,0,0,0.6), /* 原有的外部阴影 */
                    inset 0 1px 1px rgba(255,255,255,0.08), /* 原有的内边缘 */
                    inset 0 -1px 1px rgba(0,0,0,0.2), /* 底部内阴影增加立体感 */

                        /* 新增：模拟彩虹边缘光线 */
                    0 0 1px 1px rgba(255, 255, 255, 0.02) inset, /* 最内层极其细微的白边 */
                    0 0 10px rgba(10, 132, 255, 0.05), /* 外部极其细微的蓝色光晕 */
                    0 0 10px rgba(50, 215, 75, 0.05); /* 外部极其细微的绿色光晕 */

            box-sizing: border-box;
        }
        .glass-inner {
            background: var(--glass-inner);
            border-radius: 16px;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.2);
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
        }

        /* ================= 左上角：控制按钮区 ================= */
        .top-left-actions { position: absolute; top: 25px; left: 30px; display: flex; gap: 15px; z-index: 50; }
        .btn-action { cursor: pointer; transition: transform 0.2s; }
        .btn-action:active { transform: scale(0.92); }
        .btn-action-inner { padding: 10px 18px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #E2E8F0; }
        .text-red { color: var(--apple-red) !important; }

        /* ================= 右上角：融合版 HUD 状态栏 ================= */
        .top-right-hud { position: absolute; top: 25px; right: 30px; z-index: 50; transition: all 0.3s ease; }
        .hud-inner-layout { display: flex; align-items: center; padding: 6px 8px; }
        .status-group { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #E2E8F0; border-radius: 12px; transition: all 0.3s; }
        .hud-divider { width: 1px; height: 18px; background: rgba(255,255,255,0.1); margin: 0 4px; }

        .signal-rings { position: relative; width: 10px; height: 10px; border-radius: 50%; }
        .online-ring { background: var(--apple-green); box-shadow: 0 0 10px var(--apple-green), 0 0 20px var(--apple-green); }
        .online-ring::before, .online-ring::after { content: ''; position: absolute; border: 1px solid var(--apple-green); border-radius: 50%; animation: radarPulse 2s linear infinite; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .online-ring::before { width: 22px; height: 22px; } .online-ring::after { width: 34px; height: 34px; animation-delay: 0.5s; }
        .offline-ring { background: var(--apple-red); box-shadow: 0 0 15px var(--apple-red); }

        @keyframes radarPulse { 0% { width: 10px; height: 10px; opacity: 1; } 100% { width: 40px; height: 40px; opacity: 0; } }

        /* ================= 选手投屏区域 ================= */
        .active-singer-board { position: absolute; top: 0; left: 0; width: 100%; padding: 40px 0 30px 0; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); text-align: center; z-index: 20; pointer-events: none; }
        .active-singer-board p { margin: 0 0 5px 0; font-size: 14px; color: rgba(255,255,255,0.5); letter-spacing: 2px; font-weight: bold;}
        .active-singer-board h1 { margin: 0; font-size: 42px; color: var(--apple-orange); text-shadow: 0 4px 20px rgba(255,159,10,0.5); letter-spacing: 2px; font-weight: 900; }

        /* ================= Swiper 与 打分卡片 ================= */
        .swiper { width: 100%; height: 100%; flex-grow: 1; padding-top: 130px; box-sizing: border-box;}
        .swiper-slide { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 30px;}

        .judge-card { width: 85%; max-width: 420px; transition: all 0.4s ease; }
        .judge-card-inner { padding: 35px 25px; display: flex; flex-direction: column; align-items: center; }

        .judge-name { font-size: 38px; font-weight: 900; color: #FFFFFF; margin-bottom: 25px; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,0.5);}
        .score-display { width: 85%; height: 75px; line-height: 75px; font-size: 55px; font-weight: bold; color: var(--apple-blue); background: rgba(0,0,0,0.7); border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(10,132,255,0.4); box-shadow: inset 0 4px 15px rgba(0,0,0,0.9), 0 0 20px rgba(10,132,255,0.3); text-align: center;}
        .score-display.empty { color: #52525b; font-size: 26px; font-weight: bold; letter-spacing: 2px; border-color: rgba(255,255,255,0.05); box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); text-shadow: none;}

        .numpad { width: 90%; margin-bottom: 25px; }
        .numpad.scale-100 { display: grid; gap: 12px; grid-template-columns: repeat(3, 1fr); }
        .numpad.scale-10 { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }

        .numpad-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; height: 65px; font-size: 30px; font-weight: bold; color: #FFFFFF; box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.1s; user-select: none;}
        .numpad-btn:active { background: rgba(255, 255, 255, 0.2); transform: scale(0.96) translateY(2px); /* 更明显的下压 */ box-shadow: 0 0 20px rgba(255,255,255,0.2); /* 增加白光晕 */ }
        .btn-del { background: rgba(239,68,68,0.2); color: var(--apple-red); border-color: rgba(239,68,68,0.3); } .btn-del:active { background: rgba(239,68,68,0.4); }
        .btn-clear { background: rgba(255,159,10,0.15); color: var(--apple-orange); border-color: rgba(255,159,10,0.3); font-size: 22px; }

        .circle-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 28px; font-weight: bold; color: #FFFFFF; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.2s; cursor: pointer; user-select: none;}
        .circle-btn:active { background: rgba(255, 255, 255, 0.2); transform: scale(0.96) translateY(2px); /* 更明显的下压 */ box-shadow: 0 0 20px rgba(255,255,255,0.2); /* 增加白光晕 */ }
        .circle-btn.selected { background: var(--apple-green); border-color: var(--apple-green); color: #000; box-shadow: 0 0 20px rgba(50,215,75,0.6); transform: scale(1.05); }

        .submit-btn { width: 90%; padding: 18px; font-size: 22px; background: linear-gradient(135deg, #0A84FF, #32D74B); color: white; border: none; border-radius: 12px; font-weight: 900; box-shadow: 0 8px 25px rgba(10,132,255,0.4); transition: 0.2s; letter-spacing: 2px; cursor: pointer;}
        .submit-btn:active { background: rgba(255, 255, 255, 0.2); transform: scale(0.96) translateY(2px); /* 更明显的下压 */ box-shadow: 0 0 20px rgba(255,255,255,0.2); /* 增加白光晕 */ }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: rgba(20,20,25,0.95); color: white; padding: 15px 30px; border-radius: 40px; font-size: 15px; font-weight: bold; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.15); opacity: 0; transform: translateY(-20px); transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); backdrop-filter: blur(10px); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { border-color: var(--apple-green); color: var(--apple-green); } .toast.error { border-color: var(--apple-red); color: var(--apple-red); } .toast.warning { border-color: var(--apple-orange); color: var(--apple-orange); }

        /* =========================================================
            🚨新增：量子浮现特效 (开屏动画与强锁通用)
        ========================================================= */
        @keyframes quantumFadeIn {
            0% { transform: scale(0.1); opacity: 0; filter: blur(20px) drop-shadow(0 0 0px rgba(10,132,255,0)); }
            50% { transform: scale(1.1); opacity: 0.9; filter: blur(2px) drop-shadow(0 0 40px rgba(10,132,255,0.8)); }
            100% { transform: scale(1); opacity: 1; filter: blur(0px) drop-shadow(0 0 15px rgba(10,132,255,0.4)); }
        }

        @keyframes unfoldCenter { 0% { clip-path: inset(0 50% 0 50%); opacity: 0; transform: scale(0.9); } 100% { clip-path: inset(0 0 0 0); opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

        /* ================= 震撼开屏动画样式 ================= */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background-color: #000000; z-index: 9999999; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center; transition: opacity 0.8s ease-out;
        }
        .splash-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-top: -10vh; }
        .splash-logo { width: 160px; margin-bottom: 25px; animation: quantumFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .splash-title-zh { display: none; /* 隐藏文本 */ font-family: 'KaiTi', 'STKaiti', 'BiauKai', serif; color: #FFFFFF; font-size: 26px; letter-spacing: 4px; margin-bottom: 8px; animation: unfoldCenter 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; white-space: nowrap; }
        .splash-title-en { display: none; /* 隐藏文本 */ font-family: -apple-system, "SF Pro Display", sans-serif; color: rgba(255, 255, 255, 0.6); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; animation: unfoldCenter 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; animation-delay: 0.2s; opacity: 0; white-space: nowrap; }
        .splash-footer { display: none; /* 隐藏文本 */ font-family: 'KaiTi', 'STKaiti', 'BiauKai', serif; color: rgba(255, 255, 255, 0.3); font-size: 14px; letter-spacing: 6px; padding-bottom: max(40px, env(safe-area-inset-bottom)); animation: fadeIn 2s ease-in forwards; }

        /* ================= 强锁界面定制 ================= */
        #global-lock-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: #000000; z-index: 100000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(25px); transition: opacity 0.3s;}
        .lock-container { display: flex; flex-direction: column; align-items: center; margin-top: -15vh; }
        .lock-logo { width: 130px; margin-bottom: 35px; animation: quantumFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; }
        #global-lock-overlay h2 { font-family: 'KaiTi', 'STKaiti', serif; color: #FFFFFF; font-size: 26px; margin-bottom: 15px; letter-spacing: 3px; font-weight: normal; animation: unfoldCenter 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;}
        #global-lock-overlay h1 { font-family: -apple-system, sans-serif; color: #FF453A; font-size: 32px; letter-spacing: 5px; margin: 0; font-weight: 900; text-shadow: 0 0 20px rgba(255,69,58,0.5); animation: unfoldCenter 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; animation-delay: 0.2s; opacity: 0; }
    </style>
</head>
<body>

<div id="splash-screen">
    <div></div>
    <div class="splash-main">
        <img src="assets/XCLOGO.webp" class="splash-logo" alt="LOGO" onerror="this.style.display='none'">
        <div class="splash-title-zh">星裁系统·专业评委端</div>
        <div class="splash-title-en">StarJudge · Professional Judge End</div>
    </div>
    <div class="splash-footer">宣甫 · 原創</div>
</div>

<div id="toast-container"></div>

<div id="global-lock-overlay">
    <div class="lock-container">
        <img src="assets/XCLOGO.webp" class="lock-logo" alt="LOGO" onerror="this.style.display='none'">
        <h2>星裁系统·专业评委端</h2>
        <h1>系统紧急安全熔断</h1>
    </div>
</div>

<div class="top-left-actions">
    <div class="glass-outer btn-action" onclick="location.reload()">
        <div class="glass-inner btn-action-inner">
            <span style="font-size: 16px;">🔄</span> 刷新页面
        </div>
    </div>
    <div class="glass-outer btn-action" onclick="reportEmergencyError()">
        <div class="glass-inner btn-action-inner text-red">
            <span style="font-size: 16px;">🚨</span> 紧急报错
        </div>
    </div>
</div>

<div class="top-right-hud glass-outer" id="main-hud">
    <div class="glass-inner hud-inner-layout">
        <div class="status-group" id="vote-status-group">
            <span id="vote-icon">🔒</span>
            <span id="vote-text">通道锁死</span>
        </div>
        <div class="hud-divider"></div>
        <div class="status-group">
            <div class="signal-rings offline-ring" id="net-ring"></div>
            <span id="net-text" style="color:var(--apple-red);">状态检测中</span>
        </div>
    </div>
</div>

<div class="active-singer-board"><p>当前打分选手</p><h1 id="active-singer">等待导播投屏...</h1></div>
<div class="swiper mySwiper"><div class="swiper-wrapper" id="judge-wrapper"></div><div class="swiper-pagination"></div></div>

<script>
    function showToast(message, type = 'normal') { const c = document.getElementById('toast-container'); const t = document.createElement('div'); t.className = `toast ${type}`; t.innerText = message; c.appendChild(t); requestAnimationFrame(() => t.classList.add('show')); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000); }

    // 🚨 核心网络重构：兼容 Tauri 桌面端与 HTTPS 浏览器强制加密
    const currentProtocol = window.location.protocol;
    const currentHostname = window.location.hostname;

    const isDesktopApp = currentProtocol === 'file:' ||
        currentProtocol.includes('tauri') ||
        currentHostname.includes('tauri') ||
        currentHostname === 'localhost' ||
        currentHostname === '127.0.0.1';

    const host = isDesktopApp ? "https://xuanfu.asia" : currentProtocol + '//' + window.location.host;
    const wsHost = isDesktopApp ? "wss://xuanfu.asia/ws/screen" : (currentProtocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws/screen';

    let currentContestantId = null; let scoresMap = {}; let judgesList = []; let sysScoreScale = 100; let isVotingOpen = false; let amILocked = false;

    // 👉 融合版 HUD：更新投票状态
    function updateVoteStatusUI() {
        const group = document.getElementById('vote-status-group');
        const icon = document.getElementById('vote-icon');
        const text = document.getElementById('vote-text');
        if (isVotingOpen) {
            group.style.background = 'rgba(50, 215, 75, 0.15)';
            group.style.color = '#32D74B';
            icon.innerText = '🟢';
            text.innerText = '通道已大开';
        } else {
            group.style.background = 'rgba(255, 69, 58, 0.15)';
            group.style.color = '#FF453A';
            icon.innerText = '🔒';
            text.innerText = '通道已锁死';
        }
    }

    // 👉 融合版 HUD：更新网络状态
    function updateNetUI(isOnline) {
        const text = document.getElementById('net-text');
        const ring = document.getElementById('net-ring');
        if (isOnline) {
            text.innerText = '云端直连中';
            text.style.color = '#E2E8F0';
            ring.className = 'signal-rings online-ring';
        } else {
            text.innerText = '离线缓存模式';
            text.style.color = '#FF453A';
            ring.className = 'signal-rings offline-ring';
        }
    }

    window.addEventListener('online', () => { updateNetUI(true); flushOfflineQueue(); }); window.addEventListener('offline', () => updateNetUI(false));

    function saveToOfflineQueue(payload, judgeName) { let queue = JSON.parse(localStorage.getItem('offline_scores') || '[]'); queue.push(payload); localStorage.setItem('offline_scores', JSON.stringify(queue)); showToast(`📶 网络异常，${judgeName.split('_').pop()} 的分数已存入保险箱！连网后自动发送`, "warning"); clearScore(judgeName); slideToNextIfActive(judgeName); }

    function flushOfflineQueue() {
        if (!navigator.onLine) return; let queue = JSON.parse(localStorage.getItem('offline_scores') || '[]'); if (queue.length === 0) return;
        let failedQueue = []; let successCount = 0;
        Promise.all(queue.map(payload => { return fetch(host + '/api/scores/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then(res => { if(res.ok) successCount++; else failedQueue.push(payload); }).catch(() => failedQueue.push(payload)); })).then(() => { localStorage.setItem('offline_scores', JSON.stringify(failedQueue)); if (successCount > 0) showToast(`🚀 网络恢复，已成功为您补发 ${successCount} 条缓存的分数！`, "success"); });
    }
    setInterval(flushOfflineQueue, 5000);

    // 🚨 紧急报错信号发送
    function reportEmergencyError() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            showToast("⚠️ 当前网络离线，无法发送报告", "error");
            return;
        }
        const payload = {
            type: 'DEVICE_REPORT',
            sender: '评委终端',
            content: '⚠️ 终端请求紧急技术支援！'
        };
        ws.send(JSON.stringify(payload));
        showToast("🚨 已向导播总控台发送紧急求助信号！", "success");
    }

    function disableJudgeCard(judgeName) {
        const card = document.getElementById(`card_${judgeName}`);
        if(card) {
            card.style.opacity = '0.4';
            card.style.pointerEvents = 'none';
            card.style.filter = 'grayscale(100%)';
            card.style.transform = 'scale(0.95)';
            const display = document.getElementById(`display_${judgeName}`);
            if(display) {
                display.innerText = "✅ 已打分";
                display.style.color = 'var(--apple-green)';
                display.style.fontSize = '40px';
                display.style.borderColor = 'rgba(50,215,75,0.3)';
            }
        }
    }

    function resetJudgeCards() {
        judgesList.forEach(judge => {
            const card = document.getElementById(`card_${judge.name}`);
            if(card) {
                card.style.opacity = '1';
                card.style.pointerEvents = 'auto';
                card.style.filter = 'none';
                card.style.transform = 'scale(1)';
                const display = document.getElementById(`display_${judge.name}`);
                if(display) {
                    display.innerText = "请打分";
                    display.style.color = '';
                    display.style.fontSize = '';
                    display.style.borderColor = '';
                    display.classList.add('empty');
                }
            }
        });
    }

    window.onload = async function() {
        updateNetUI(navigator.onLine); flushOfflineQueue();
        const confRes = await fetch(`${host}/api/scores/config`); const conf = await confRes.json();
        sysScoreScale = conf.scoreScale; isVotingOpen = conf.isVotingOpen; amILocked = conf.lockTeacher;
        checkVotingStatus(); updateVoteStatusUI();

        fetch(host + '/api/judges').then(res => res.json()).then(data => {
            judgesList = data.filter(j => !j.name.startsWith('CADRE_'));

            const wrapper = document.getElementById('judge-wrapper');
            if(judgesList.length === 0) { wrapper.innerHTML = '<h3 style="color:rgba(255,255,255,0.5); text-align:center; width:100%; margin-top:50px;">后台未绑定教师终端</h3>'; return; }

            // 🚨 将原有的卡片包裹在 glass-outer 和 glass-inner 中，实现 20px=16px+4px 的圆角嵌套
            judgesList.forEach(judge => {
                let display = judge.name.startsWith('TEACHER_') ? judge.name.substring(8) : judge.name;
                wrapper.innerHTML += `
                <div class="swiper-slide">
                    <div class="glass-outer judge-card" id="card_${judge.name}">
                        <div class="glass-inner judge-card-inner">
                            <div style="color:rgba(255,255,255,0.4); margin-bottom:15px; font-size: 13px; font-weight:bold; letter-spacing:1px;">👇 打分后自动切至下一位</div>
                            <div class="judge-name">${display}</div>
                            <div class="score-display empty" id="display_${judge.name}">请打分</div>
                            <div id="numpad_${judge.name}"></div>
                            <button class="submit-btn" onclick="submitScore('${judge.name}')">🔒 确认提交</button>
                        </div>
                    </div>
                </div>`;
            });
            new Swiper(".mySwiper", { effect: "coverflow", grabCursor: true, centeredSlides: true, slidesPerView: "auto", pagination: { el: ".swiper-pagination", clickable: true } });
            renderAllNumpads();

            if (conf.activeContestantId) {
                currentContestantId = conf.activeContestantId;
                syncHistoricalScores(currentContestantId);
            }

            // 🚨 开屏动画优雅退场
            const splashScreen = document.getElementById('splash-screen');
            if (splashScreen) {
                setTimeout(() => {
                    splashScreen.style.opacity = '0';
                    setTimeout(() => { splashScreen.style.display = 'none'; }, 800);
                }, 1500);
            }
        });
    };

    function syncHistoricalScores(contestantId) {
        fetch(host + '/api/scores/details/' + contestantId)
            .then(res => res.json())
            .then(records => {
                records.forEach(r => {
                    if (r.judgeType === 'JUDGE') {
                        disableJudgeCard(r.judgeName);
                    }
                });
            })
            .catch(e => console.error("同步历史分数失败", e));
    }

    function renderAllNumpads() {
        judgesList.forEach(judge => {
            const container = document.getElementById(`numpad_${judge.name}`); if (!container) return;
            if (sysScoreScale === 10) {
                container.className = 'numpad scale-10'; let html = '';
                for(let i=1; i<=10; i++) html += `<div class="circle-btn" id="btn_${judge.name}_${i}" onclick="directSetScore('${judge.name}', '${i}')">${i}</div>`;
                container.innerHTML = html;
            } else {
                container.className = 'numpad scale-100';
                container.innerHTML = `<div class="numpad-btn" onclick="pressKey('${judge.name}', '1')">1</div><div class="numpad-btn" onclick="pressKey('${judge.name}', '2')">2</div><div class="numpad-btn" onclick="pressKey('${judge.name}', '3')">3</div><div class="numpad-btn" onclick="pressKey('${judge.name}', '4')">4</div><div class="numpad-btn" onclick="pressKey('${judge.name}', '5')">5</div><div class="numpad-btn" onclick="pressKey('${judge.name}', '6')">6</div><div class="numpad-btn" onclick="pressKey('${judge.name}', '7')">7</div><div class="numpad-btn" onclick="pressKey('${judge.name}', '8')">8</div><div class="numpad-btn" onclick="pressKey('${judge.name}', '9')">9</div><div class="numpad-btn btn-clear" onclick="clearScore('${judge.name}')">清空</div><div class="numpad-btn" onclick="pressKey('${judge.name}', '0')">0</div><div class="numpad-btn btn-del" onclick="deleteKey('${judge.name}')">⌫</div>`;
            }
        });
    }

    function updateDisplay(judgeName) { const display = document.getElementById(`display_${judgeName}`); const currentScore = scoresMap[judgeName] || ""; if (currentScore === "") { display.innerText = "请打分"; display.classList.add('empty'); } else { display.innerText = currentScore; display.classList.remove('empty'); } }
    function pressKey(judgeName, num) { let current = scoresMap[judgeName] || ""; if (current === "" && num === "0") return; if (current.length >= 3 && current !== "10") return; let newScore = current + num; if (parseInt(newScore) > sysScoreScale) return showToast(`⚠️ 最高只能打 ${sysScoreScale} 分哦`, "warning"); scoresMap[judgeName] = newScore; updateDisplay(judgeName); }
    function directSetScore(judgeName, num) { scoresMap[judgeName] = num; updateDisplay(judgeName); document.querySelectorAll(`#numpad_${judgeName} .circle-btn`).forEach(b => b.classList.remove('selected')); document.getElementById(`btn_${judgeName}_${num}`).classList.add('selected'); }
    function deleteKey(judgeName) { let current = scoresMap[judgeName] || ""; scoresMap[judgeName] = current.slice(0, -1); updateDisplay(judgeName); }
    function clearScore(judgeName) { scoresMap[judgeName] = ""; updateDisplay(judgeName); if(sysScoreScale === 10) document.querySelectorAll(`#numpad_${judgeName} .circle-btn`).forEach(b => b.classList.remove('selected')); }

    function checkVotingStatus() { document.getElementById('global-lock-overlay').style.display = amILocked ? 'flex' : 'none'; }

    // 👉 核心逻辑：解决多台平板同时登录时，滑动冲突的问题
    function slideToNextIfActive(judgeName) {
        const swiperEl = document.querySelector('.swiper');
        if(swiperEl && swiperEl.swiper) {
            const swiper = swiperEl.swiper;
            const activeSlide = swiper.slides[swiper.activeIndex];
            // 只有当当前平板显示的正是刚刚打分的老师时，才自动滑屏。防止干扰另一台平板
            if(activeSlide && activeSlide.querySelector(`#card_${judgeName}`)) {
                swiper.slideNext();
            }
        }
    }

    let ws; let reconnectInterval = null; let heartbeatTimer = null;
    function connectWebSocket() {
        ws = new WebSocket(wsHost);
        ws.onopen = function() { if (reconnectInterval) { clearInterval(reconnectInterval); reconnectInterval = null; } if (heartbeatTimer) clearInterval(heartbeatTimer); heartbeatTimer = setInterval(() => { if (ws.readyState === WebSocket.OPEN) { try { ws.send(JSON.stringify({type: 'PING'})); } catch(e) {} } }, 5000); };
        ws.onmessage = function(event) {
            const cmd = JSON.parse(event.data);
            if (cmd.type === 'SHOW_SINGER') {
                currentContestantId = cmd.data.id;
                const showNum = cmd.displayNum || cmd.data.id;
                document.getElementById('active-singer').innerText = `${showNum}号: ${cmd.data.name}`;
                scoresMap = {};

                document.querySelectorAll('.circle-btn').forEach(b => b.classList.remove('selected'));
                resetJudgeCards();
                syncHistoricalScores(currentContestantId);

                if(document.querySelector('.swiper') && document.querySelector('.swiper').swiper) {
                    document.querySelector('.swiper').swiper.slideTo(0);
                }
            }
            else if (cmd.type === 'JUDGE_SCORE') {
                disableJudgeCard(cmd.judgeName);
                slideToNextIfActive(cmd.judgeName); // 调用安全的防冲突滑屏逻辑
            }
            else if (cmd.type === 'FORCE_VOTE_START' || cmd.type === 'START_COUNTDOWN') {
                isVotingOpen = true; updateVoteStatusUI(); showToast("导播已开启打分通道", "success");
            }
            else if (cmd.type === 'FORCE_VOTE_STOP') {
                isVotingOpen = false; updateVoteStatusUI(); showToast("导播已关闭打分通道", "warning");
            }
            else if (cmd.type === 'VOTE_CTRL') {
                if (cmd.target === 'ALL' || cmd.target === 'TEACHER') { amILocked = !cmd.isOpen; checkVotingStatus(); }
            }
            else if (cmd.type === 'EMERGENCY_LOCK') {
                if (cmd.target === 'ALL' || cmd.target === 'TEACHER') { amILocked = cmd.isLocked; checkVotingStatus(); }
            }
            else if (cmd.type === 'SCALE_CHANGED') { sysScoreScale = cmd.scale; scoresMap = {}; resetJudgeCards(); renderAllNumpads(); }
        };
        ws.onclose = function() { if (heartbeatTimer) clearInterval(heartbeatTimer); if (!reconnectInterval) reconnectInterval = setInterval(connectWebSocket, 3000); };
        ws.onerror = function() { ws.close(); };
    }
    connectWebSocket();

    function submitScore(judgeName) {
        if (amILocked) return showToast("⚠️ 导播已锁死通道，暂无法提交！", "error");
        if (!isVotingOpen) return showToast("⚠️ 导播未开启计分通道", "warning");
        if (!currentContestantId) return showToast("⚠️ 导播还没切选手呢，请稍等！", "warning");
        const scoreVal = scoresMap[judgeName];
        if (!scoreVal || scoreVal === "") return showToast("⚠️ 请先输入分数！", "warning");

        const payload = { contestantId: currentContestantId, judgeName: judgeName, score: parseInt(scoreVal, 10), judgeType: 'JUDGE' };
        if (!navigator.onLine) { saveToOfflineQueue(payload, judgeName); return; }

        fetch(host + '/api/scores/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then(res => {
            if(!res.ok) { res.text().then(msg => showToast(msg, "error")); return; }
            let displayName = judgeName.startsWith('TEACHER_') ? judgeName.substring(8) : judgeName;
            showToast(`✅ ${displayName} 打分成功！`, "success");
            // WebSocket 收到广播后会自动触发置灰和滑屏，这里无需手动调用
        }).catch(() => { saveToOfflineQueue(payload, judgeName); });
    }
</script>
</body>
